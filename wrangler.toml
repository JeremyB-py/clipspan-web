# Workers Builds runs `npx wrangler deploy`. This is a Worker with static assets,
# not a classic Pages project.
name = "clipspan-web"
compatibility_date = "2024-11-12"
main = "src/worker.js"

[assets]
directory = "."
html_handling = "auto-trailing-slash"
binding = "ASSETS"
run_worker_first = ["/api/*"]
