# Workers Builds runs `npx wrangler deploy`.
# Static files live in public/ so `wrangler dev` does not watch `.wrangler/`
# (that loop happens if assets.directory is the repo root).
name = "clipspan-web"
compatibility_date = "2024-11-12"
main = "src/worker.js"

[assets]
directory = "./public"
html_handling = "auto-trailing-slash"
binding = "ASSETS"
# All hosts, including apt.clipspan.com (public/apt served at URL root).
run_worker_first = true

[secrets]
required = ["DOWNLOADS_SESSION_KEY", "GITHUB_TOKEN"]

# Per-tester download codes, managed with scripts/tester-codes.mjs. Keys are
# SHA-256 hashes of the codes, never the codes. Create the namespace with
# `npx wrangler kv namespace create clipspan-web-tester-codes` and paste its id.
[[kv_namespaces]]
binding = "TESTER_CODES"
id = "b985d0b0f4284a75974eda82b9cd480c"

# Per-IP limits on the public /updates/ routes and on tester code attempts
# (see src/worker.js). Counters are per Cloudflare location; period must be
# 10 or 60 seconds. namespace_id is any integer unique within the Cloudflare account.
[[ratelimits]]
name = "UPDATES_MANIFEST_LIMITER"
namespace_id = "1001"
simple = { limit = 30, period = 60 }

[[ratelimits]]
name = "UPDATES_FILE_LIMITER"
namespace_id = "1002"
simple = { limit = 6, period = 60 }

[[ratelimits]]
name = "AUTH_LIMITER"
namespace_id = "1003"
simple = { limit = 10, period = 60 }
